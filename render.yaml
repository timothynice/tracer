services:
  - type: web
    name: tracer-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://tracer-frontend-z5u3.onrender.com"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MAX_UPLOAD_CACHE_BYTES
        value: "67108864"
      - key: UPLOAD_TTL_SECONDS
        value: "900"
    healthCheckPath: /health

  - type: web
    name: tracer-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && VITE_API_URL=https://tracer-n32i.onrender.com npm run build
    staticPublishPath: frontend/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: "https://tracer-n32i.onrender.com"
