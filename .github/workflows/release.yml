name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Require signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_PRIVATE_KEY APPLE_API_KEY APPLE_API_ISSUER TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret ${name}; refusing to create an unsigned release"
              exit 1
            fi
          done
          umask 077
          key_path="${RUNNER_TEMP}/studi0trace-notary.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          echo "APPLE_API_KEY_PATH=${key_path}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Tag matches the app's version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          conf_version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          echo "tag:        ${tag_version}"
          echo "tauri.conf: ${conf_version}"
          if [ "${tag_version}" != "${conf_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the version in tauri.conf.json (${conf_version})"
            exit 1
          fi

      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Desktop install
        working-directory: apps/desktop
        run: npm ci

      # The release ships the freshly generated file, whatever is committed.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli
      - name: Generate third-party notices
        run: bash apps/desktop/scripts/notices.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          projectPath: apps/desktop
          tauriScript: bash scripts/release.sh
          tagName: v__VERSION__
          releaseName: Studi0Trace __VERSION__
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
          releaseBody: |
            Download the `.dmg`, open it and drag Studi0Trace to Applications.

            Signed with Developer ID and notarized by Apple for Intel and Apple silicon Macs. No security-setting changes are needed.

            The app checks for updates itself (Studi0Trace ▸ Check for Updates…).

      - name: Remove notarization key
        if: always()
        run: rm -f "${RUNNER_TEMP}/studi0trace-notary.p8"
