name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Tag matches the app's version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          conf_version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          echo "tag:        ${tag_version}"
          echo "tauri.conf: ${conf_version}"
          if [ "${tag_version}" != "${conf_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the version in tauri.conf.json (${conf_version})"
            exit 1
          fi

      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Desktop install
        working-directory: apps/desktop
        run: npm ci

      # The release ships the freshly generated file, whatever is committed.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli
      - name: Generate third-party notices
        run: bash apps/desktop/scripts/notices.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Studi0Trace __VERSION__
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
          releaseBody: |
            Download the `.dmg`, open it and drag Studi0Trace to Applications.

            Studi0Trace is not notarized, so macOS blocks it the first time. To open it, go to System Settings ▸ Privacy & Security and choose Open Anyway, or run this in Terminal:

            ```
            xattr -dr com.apple.quarantine /Applications/Studi0Trace.app
            ```

            The app checks for updates itself (Studi0Trace ▸ Check for Updates…).
