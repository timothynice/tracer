name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm run test:run
      # The desktop crate embeds frontend/dist when it compiles, so this comes before any cargo build.
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --workspace --release
      - name: Clippy (desktop crate)
        run: cargo clippy -p studi0trace-desktop --release --no-deps -- -D warnings

      # A dependency change without regenerated notices fails here.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli
      - name: Third-party notices are current
        run: |
          bash apps/desktop/scripts/notices.sh
          git diff --exit-code apps/desktop/src-tauri/resources/THIRD_PARTY_NOTICES.html
