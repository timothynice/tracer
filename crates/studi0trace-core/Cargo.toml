[package]
name = "studi0trace-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Studi0Trace: everything around the Vexel engine, for the app and the web build"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
vexel-rs = { path = "../../backend/vexel-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
# the id of an upload is a hash of its bytes (api.rs); pure Rust, so it builds for wasm32 too
sha2 = "0.10"
roxmltree = "0.21.1"
rayon = "1.10"
resvg = { version = "=0.48.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
pyo3 = { version = "0.22", features = ["abi3-py312"], optional = true }

[dev-dependencies]
# the fixtures' floats read back to the bit (serde_json's default parser can be an ulp off)
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[features]
default = []
python = ["dep:pyo3", "pyo3/extension-module"]
