[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studi0trace"
version = "0.2.0"
description = "Studi0Trace backend: pluggable raster-to-SVG tracing engines and the Vexel fidelity bench"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "vtracer>=0.6",
    "pydantic>=2.7",
    "anyio>=4",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-image>=0.24",
]

[project.optional-dependencies]
bench = [
    "resvg-py>=0.2",
    "pyyaml>=6",
]
dev = [
    "studi0trace[bench]",
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[project.scripts]
studi0trace-bench = "bench.cli:main"

[tool.setuptools.packages.find]
include = ["studi0trace*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
