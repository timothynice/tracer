[package]
name = "studi0trace-desktop"
version = "0.3.1"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Studi0Trace for Mac: the Tauri shell around studi0trace-core"
publish = false

[lib]
name = "studi0trace_desktop"
crate-type = ["rlib"]

[[bin]]
name = "studi0trace-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# no `macos-private-api`: transparent windows no longer need it (tauri 2.12), and tauri-build insists the feature
# and `app.macOSPrivateApi` agree, so neither is set
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-store = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2"
studi0trace-core = { path = "../../../crates/studi0trace-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
# AI redraw (src/redraw/): the reqwest tauri-plugin-updater already brings, on the same TLS stack (rustls with ring
# and the platform verifier). No default features: they would add aws-lc-rs, a second crypto provider with C in it.
# `multipart` for the image edit, `stream` to know when the upload has gone.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "multipart", "stream"] }
# the provider the updater installs; redraw/openai.rs installs it when it comes first
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
futures-util = { version = "0.3", default-features = false }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
# PDF export (export.rs): a vector PDF from the SVG, gradients kept; `filters` rasterises a blur through resvg.
# No `text`: the engine writes no text, and fonts would bring fontdb.
svg2pdf = { version = "0.13", default-features = false, features = ["filters"] }

[target.'cfg(target_os = "macos")'.dependencies]
# already in the tree through tao; used only to answer applicationShouldTerminate: (quit.rs)
objc2 = "0.6"
# already in the tree through rustls-platform-verifier; the OpenAI key's generic password (keychain.rs)
security-framework = "3"

[dev-dependencies]
muda = "0.20"
