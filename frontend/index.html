<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3f4d60" />
    <meta name="description" content="Studi0Trace turns raster images into faithful SVG vectors." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Studi0Trace</title>
    <script>
      // Apply the saved appearance before first paint to avoid a flash. The app mirrors it into
      // studi0trace.appearance (its store has no synchronous read); a browser's settings hold it too.
      try {
        var t = localStorage.getItem("studi0trace.appearance");
        if (!t) {
          var raw = localStorage.getItem("studi0trace.settings");
          t = raw && JSON.parse(raw).appearance;
        }
        t = t || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
